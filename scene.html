<!DOCTYPE html><html lang="es"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#080e18;color:#edf3ff;font:14px system-ui}#wrap{position:relative;height:550px;border:1px solid #30445e;border-radius:24px;overflow:hidden}canvas{width:100%;height:100%;touch-action:none;outline:none}.top{position:absolute;left:24px;top:20px;pointer-events:none}.top small{letter-spacing:3px;color:#99b4d8}.top h2{font:30px Georgia;margin:10px 0}.bottom{position:absolute;bottom:16px;left:16px;right:16px;display:flex;gap:8px;flex-wrap:wrap}button{background:#132239e8;color:#eff5ff;border:1px solid #52647c;padding:10px 13px;border-radius:12px;cursor:pointer}button:focus-visible{outline:2px solid #ff8a4c}#status{color:#b9c9dd;font-size:12px;max-width:330px}#voice{position:absolute;right:16px;top:20px;max-width:240px;font-size:12px;color:#c1cfe0}#hint{position:absolute;bottom:70px;left:20px;color:#a6b7cb;font-size:11px}
</style><div id="wrap"><canvas id="view" aria-label="Cubículo 3D con zona de estudio y descanso"></canvas><div class="top"><small>GUARIDA / AURORA</small><h2 id="title">Tu espacio, en calma.</h2><div id="status">Conectando representación…</div></div><div id="voice"></div><div id="hint">Arrastra para girar · Rueda para acercar</div><div class="bottom"><button onclick="order('concentracion')">Concentración</button><button onclick="order('descanso')">Descanso</button><button onclick="listen()">🎙 Voz</button><button onclick="welcome()">Escuchar</button><button id="sound" onclick="sound()">Sonido</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@8.0.0/babylon.js"></script><script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script><script>
const cfg=__CONFIG__;let client,last=0,pending=null;const status=document.getElementById('status');
function order(state){if(!client?.connected){status.textContent='Sin conexión: no se envió la orden';return}pending={v:1,id:crypto.randomUUID(),state};client.publish('guarida/'+cfg.room+'/command',JSON.stringify(pending),{qos:1,retain:false});status.textContent='Esperando confirmación…';setTimeout(()=>{if(pending)status.textContent='Sin confirmar. Revisa Wokwi.'},8000)}
let panel,ring;const colors={concentracion:'#4c8dff',descanso:'#ff8a4c',disponible:'#67d6ba'};
function apply(d){if(d.v!==1||!colors[d.state]||!['wokwi','test-emulator'].includes(d.source))return;last=Date.now();if(pending?.id===d.id&&pending.state===d.state)pending=null;status.textContent=(d.source==='wokwi'?'Wokwi confirmado: ':'Emulador de prueba: ')+d.state+(pending?' · hay orden pendiente':'');if(panel){panel.emissiveColor=BABYLON.Color3.FromHexString(colors[d.state]);ring.emissiveColor=panel.emissiveColor.scale(.65)}}
try{
 const engine=new BABYLON.Engine(document.getElementById('view'),true);const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.025,.045,.08,1);
 const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2.5,1.08,11,new BABYLON.Vector3(0,1,0),scene);camera.attachControl(document.getElementById('view'),true);camera.lowerRadiusLimit=6;camera.upperRadiusLimit=15;camera.upperBetaLimit=1.5;
 new BABYLON.HemisphericLight('sky',new BABYLON.Vector3(0,1,0),scene).intensity=1.2;
 const glow=new BABYLON.GlowLayer('glow',scene);glow.intensity=.35;
 function mat(name,color){const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=BABYLON.Color3.FromHexString(color);m.specularColor=new BABYLON.Color3(.15,.15,.15);return m}
 const wall=mat('navy','#243349'),floor=mat('floor','#152133'),wood=mat('wood','#96735d'),dark=mat('dark','#101b2a'),fabric=mat('fabric','#637789'),copper=mat('copper','#d38a61');panel=mat('screen','#172234');ring=mat('line','#506783');
 function box(name,w,h,d,x,y,z,m){const b=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);b.position.set(x,y,z);b.material=m;return b}
 box('base',7,.2,4.6,0,0,0,floor);box('back',7,3,.14,0,1.5,2.25,wall);box('left',.14,3,4.6,-3.5,1.5,0,wall);box('divider',.12,2.5,1.7,.6,1.25,1.3,wall);
 box('desk',2.8,.12,1.15,-1.55,1.25,1.2,wood);for(const x of [-2.7,-.4])box('leg',.08,1.2,.08,x,.6,1.2,dark);
 box('monitor',1.12,.72,.06,-1.6,1.72,1.65,dark);box('display',1,.6,.015,-1.6,1.72,1.61,panel);box('stand',.08,.3,.08,-1.6,1.35,1.65,dark);box('keyboard',.8,.03,.3,-1.6,1.33,1.03,dark);
 box('seat',.8,.17,.75,-1.5,.68,-.1,fabric);box('chairback',.8,.9,.15,-1.5,1.15,-.47,fabric);box('chairleg',.12,.6,.12,-1.5,.3,-.1,dark);
 box('sofa',1.6,.4,.85,2,.43,1.35,fabric);box('backrest',1.6,.65,.2,2,.88,1.75,fabric);for(const x of [1.15,2.85])box('arm',.16,.65,.9,x,.65,1.35,fabric);
 const table=BABYLON.MeshBuilder.CreateCylinder('table',{diameter:1,height:.12},scene);table.position.set(2,.64,-.2);table.material=wood;box('tableleg',.15,.6,.15,2,.3,-.2,dark);
 for(let i=0;i<12;i++)box('slat',.035,2.4,.03,-3.35+i*.22,1.6,2.14,wood);
 box('strip',6.6,.035,.04,0,2.78,2.15,ring);box('sign',1.3,.46,.05,1.9,2.25,2.12,panel);
 const pot=BABYLON.MeshBuilder.CreateCylinder('pot',{diameterTop:.38,diameterBottom:.26,height:.45},scene);pot.position.set(2.9,.32,-1.5);pot.material=copper;
 const leafmat=mat('leaves','#577e71');for(let i=0;i<5;i++){const leaf=BABYLON.MeshBuilder.CreateSphere('leaf',{diameter:.4},scene);leaf.scaling.set(.45,2, .5);leaf.position.set(2.9+Math.cos(i)*.13,.9+Math.sin(i)*.12,-1.5);leaf.rotation.z=Math.sin(i)*.5;leaf.material=leafmat}
 if(cfg.zone==='rest')camera.alpha=-Math.PI/3;
 engine.runRenderLoop(()=>scene.render());window.addEventListener('resize',()=>engine.resize());
 client=mqtt.connect('wss://'+cfg.host+':8884/mqtt',{clientId:'guarida-view-'+crypto.randomUUID(),reconnectPeriod:3000,connectTimeout:10000});client.on('connect',()=>{status.textContent='MQTT conectado · esperando Wokwi';client.subscribe('guarida/'+cfg.room+'/state')});client.on('message',(topic,msg,packet)=>{if(packet.retain)return;try{apply(JSON.parse(msg.toString()))}catch{}});client.on('error',()=>status.textContent='No se pudo conectar la vista 3D a MQTT');client.on('offline',()=>status.textContent='Vista 3D sin conexión');
 setInterval(()=>{if(last&&Date.now()-last>15000){status.textContent='Sin señal reciente de Wokwi';panel.emissiveColor=BABYLON.Color3.Black();ring.emissiveColor=BABYLON.Color3.Black()}},2000);
}catch(e){status.textContent='No se pudo iniciar 3D: '+e.message}
function welcome(){if(!window.speechSynthesis){status.textContent='Tu navegador no dispone de voz';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Bienvenido a Guarida. ¿Qué quieres lograr hoy? Escribe tu objetivo en el panel de estudio.');u.lang='es-ES';speechSynthesis.speak(u)}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('voice').textContent='Voz no disponible. Usa los botones.';return}const r=new R();r.lang='es-ES';r.continuous=false;r.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();document.getElementById('voice').textContent='Escuché: '+t;if(/descans/.test(t))order('descanso');else if(/concentr/.test(t))order('concentracion');else if(/disponible/.test(t))order('disponible');else document.getElementById('voice').textContent='Di concentración, descanso o disponible.'};r.onerror=()=>document.getElementById('voice').textContent='No se pudo escuchar. Usa los botones.';r.start()}
let audioctx;function sound(){if(audioctx){audioctx.close();audioctx=null;document.getElementById('sound').textContent='Sonido';return}audioctx=new AudioContext();const gain=audioctx.createGain();gain.gain.value=.025;gain.connect(audioctx.destination);for(const [freq,pan] of [[220,-1],[228,1]]){const o=audioctx.createOscillator(),p=audioctx.createStereoPanner();o.frequency.value=freq;p.pan.value=pan;o.connect(p);p.connect(gain);o.start()}document.getElementById('sound').textContent='Silenciar'}
</script></html>
